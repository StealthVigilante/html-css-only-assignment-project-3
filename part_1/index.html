<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <nav>
            <div class="logo"><img src="resources/logo-removebg-preview.png" alt=""></div>
            <div class="links">
                <div>About</div>
                <div>Watch now</div>
                <div>Actors</div>
                <div>Contact</div>
            </div>
            <div class="menu"><i class="ri-menu-3-line"></i></div>
        </nav>
        <section class="main">
            <div class="left">
                <div class="big-logo">
                    <img src="resources/logo-removebg-preview.png" alt="">
                    <div class="star1"><i class="ri-shining-fill"></i></div>
                    <div class="star2"><i class="ri-shining-fill"></i></div>
                    <div class="description">Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>
                    Season 1: 9 Episodes</div>
                </div>
                <div class="play-watch">
                    <div id="play-now">
                        <div class="play1"><i class="ri-play-fill"></i></div>
                        <div>Play Now</div>
                    </div>
                    <div id="watch-trailer">
                        <div class="play2"><i class="ri-play-line"></i></div>
                        <div>Watch Trailer</div>
                    </div>
                </div>
            </div>
            <div class="scroll-line">
                <div class="hr-line"></div>
                <div class-scroll>SCROLL</div>
            </div>
            <div class="socials">
                <div><i class="ri-twitter-line"></i></div>
                <div><i class="ri-instagram-line"></i></div>
                <div><i class="ri-facebook-circle-line"></i></div>
            </div>
        </section>

        <section class="back">
            <h2 id="game">GAME</h2>
            <div class="backimg"><img src="resources/squid-game-soldier-mask-seeklogo.png" alt=""></div>
            <div id="squid">SQUID</div>
        </section>
        <section id="more-videos">
            <div class="video">
                <div class="thumbnail"><img src="resources/thumb1.jpg" alt=""></div>
                <div class="small-play play-1"><i class="ri-play-fill"></i></div>
            </div>
            <div class="video">
                <div class="thumbnail"><img src="resources/thumb2.jpeg" alt=""></div>
                <div class="small-play play-2"><i class="ri-play-fill"></i></div>
            </div>
            <div class="video">
                <div class="thumbnail"><img src="resources/thumb3.jpeg" alt=""></div>
                <div class="small-play play-3"><i class="ri-play-fill"></i></div>
            </div>
            <div class="video">
                <div class="thumbnail"><img src="resources/thumb4.jpg" alt=""></div>
                <div class="small-play play-4"><i class="ri-play-fill"></i></div>
            </div>
        </section>
</body>
</html>
